---
# Author: Mihir Brijesh Solanki (40481948)
# CWE Insight — GitLab CI/CD Pipeline Configuration
# This file defines the Continuous Integration/Continuous Deployment pipeline for CWE Insight
# Pipeline stages: test → sast → dependency-scan → quality
# Each stage must complete successfully before the next begins
# Uses GitLab's shared runners with Python 3.12 slim image

# Base Docker image for all jobs
image: python:3.12-slim

# Define pipeline stages in execution order
stages:
  - test          # Run unit tests
  - sast          # Static Application Security Testing
  - dependency-scan  # Check for vulnerable dependencies
  - quality       # Code quality checks

# Global variables available to all jobs
variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"  # Cache pip packages for faster builds
  FLASK_ENV: "testing"  # Set Flask environment to testing mode

# Cache configuration to speed up subsequent pipeline runs
cache:
  paths:
    - .cache/pip  # Cache pip downloads

# Commands to run before each job
before_script:
  - pip install --quiet -r requirements-dev.txt  # Install development dependencies silently

# ─── Stage 1: Test ────────────────────────────────────────────────────────────
# Run the full test suite. A single test failure fails the entire pipeline,
# ensuring no untested code reaches later stages.
unit-tests:
  stage: test
  before_script:
    - pip install --quiet -r requirements-dev.txt
  script:
    - pytest tests/ -v --tb=short --junitxml=pytest-results.xml
  timeout: 10 minutes
  artifacts:
    when: always
    reports:
      junit: pytest-results.xml
    expire_in: 1 week

# ─── Stage 2: SAST ────────────────────────────────────────────────────────────
# Bandit performs Static Application Security Testing (SAST) on the app source.
# -ll flag: report only Medium and High severity findings (Low is noise).
# The JSON report is saved as a GitLab artifact and provides evidence of
# DevSecOps practice — it is directly cited in the report's DevSecOps section.
sast-bandit:
  stage: sast
  script:
    - pip install --quiet bandit
    - bandit -r app/ -f json -o bandit-report.json || true
    - bandit -r app/ -ll --exit-zero
    - echo "=== Bandit Summary ==="
    - |
      python -c "
      import json, sys
      try:
          r = json.load(open('bandit-report.json'))
          metrics = r.get('metrics', {}).get('_totals', {})
          highs = int(metrics.get('SEVERITY.HIGH', 0))
          meds = int(metrics.get('SEVERITY.MEDIUM', 0))
          print('High: ' + str(highs) + ', Medium: ' + str(meds))
          if highs > 0:
              sys.exit(1)
      except Exception as e:
          print('Warning: could not parse bandit report -', str(e))
      "
  artifacts:
    when: always
    paths:
      - bandit-report.json
    expire_in: 4 weeks
  allow_failure: false

# ─── Stage 3: Dependency Scanning ─────────────────────────────────────────────
# Safety checks all installed packages against a database of known CVEs.
# The JSON report is saved as DevSecOps evidence.
# allow_failure: true because safety requires authentication in CI environments
# and known CVEs in transitive deps shouldn't block delivery.
dependency-scan:
  stage: dependency-scan
  script:
    - pip install --quiet -r requirements-dev.txt
    - pip install --quiet safety || true
    - safety check --json > safety-report.json 2>&1 || true
    - safety check --short-report 2>&1 || true
    - echo "Dependency scan complete (see safety-report.json artifact)"
  artifacts:
    when: always
    paths:
      - safety-report.json
    expire_in: 4 weeks
  allow_failure: true

# ─── Stage 4: Coverage Quality Gate ───────────────────────────────────────────
# Fails the pipeline if test coverage of the app package drops below 70%.
# This enforces that new code cannot be merged without adequate test coverage,
# preventing untested code from entering the main branch.
# Current coverage: 90% — well above the 70% threshold.
coverage-gate:
  stage: quality
  before_script:
    - pip install --quiet -r requirements-dev.txt
  script:
    - pytest tests/ --cov=app --cov-report=term-missing --cov-fail-under=70
  coverage: '/TOTAL.*\s+(\d+%)$/'
